name: Mark runtime
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.14']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
  codex-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e .
      - run: npm install --global --ignore-scripts @openai/codex@0.144.1
      - run: python scripts/probe_codex_tools.py --images 0
      - run: python scripts/probe_codex_tools.py --images 1
      - run: python scripts/probe_codex_tools.py --images 2
      - run: python scripts/probe_codex_tools.py --images 0 --reasoning-effort high

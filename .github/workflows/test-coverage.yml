name: Test Coverage Check

on:
  push:
    branches: [ main, develop, hotfix/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/testpassword
          NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testpassword 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio pytest-cov coverage
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
    
    - name: Run tests with coverage
      env:
        NEO4J_URL: bolt://localhost:7687
        NEO4J_USER: neo4j
        NEO4J_PASSWORD: testpassword
                 PYTHONPATH: /home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}
       run: |
         cd LongChainAPI
         # Запускаем тесты с измерением покрытия
         pytest --cov=. --cov-report=xml --cov-report=term-missing --cov-report=html -v || true
        
        # Получаем процент покрытия
        coverage report | grep TOTAL | awk '{print $4}' | sed 's/%//' > coverage_percent.txt
        COVERAGE=$(cat coverage_percent.txt)
        echo "Coverage: ${COVERAGE}%"
        
        # Проверяем минимальное покрытие (50%)
        if [ -z "$COVERAGE" ]; then
          echo "❌ Failed to calculate coverage"
          exit 1
        fi
        
        if (( $(echo "$COVERAGE < 50" | bc -l) )); then
          echo "❌ Coverage ${COVERAGE}% is below 50% minimum"
          exit 1
        else
          echo "✅ Coverage ${COVERAGE}% meets minimum requirement"
        fi
    
    - name: Upload coverage reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: coverage-report
        path: |
          coverage.xml
          htmlcov/
          coverage_percent.txt
    
    - name: Comment PR with coverage
      uses: actions/github-script@v6
      if: github.event_name == 'pull_request'
      with:
        script: |
          const fs = require('fs');
          let coverage = 'N/A';
          try {
            coverage = fs.readFileSync('coverage_percent.txt', 'utf8').trim();
          } catch (err) {
            console.log('Could not read coverage');
          }
          
          const comment = `## 📊 Test Coverage Report
          
          **Coverage: ${coverage}%** ${parseFloat(coverage) >= 50 ? '✅' : '❌'}
          
          ${parseFloat(coverage) < 50 ? '⚠️ Coverage is below the 50% minimum requirement!' : '✨ Coverage meets the minimum requirement!'}
          
          View the full HTML report in the workflow artifacts.`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          })
    
    - name: Set status badge
      if: always()
      run: |
        COVERAGE=$(cat coverage_percent.txt || echo "0")
        echo "COVERAGE=${COVERAGE}" >> $GITHUB_ENV
        
        if (( $(echo "$COVERAGE >= 80" | bc -l) )); then
          COLOR="brightgreen"
        elif (( $(echo "$COVERAGE >= 60" | bc -l) )); then
          COLOR="green"
        elif (( $(echo "$COVERAGE >= 50" | bc -l) )); then
          COLOR="yellow"
        elif (( $(echo "$COVERAGE >= 30" | bc -l) )); then
          COLOR="orange"
        else
          COLOR="red"
        fi
        
        echo "BADGE_COLOR=${COLOR}" >> $GITHUB_ENV
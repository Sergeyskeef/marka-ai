# extras/compose.sandbox.yml
version: "3.9"

volumes:
  dev_sandbox:

services:
  # ⬇️ новый контейнер-песочница
  sandbox:
    image: python:3.10-slim
    container_name: sandbox
    command: ["sleep", "infinity"]          # просто ждёт команд
    working_dir: /workspace
    networks: [marka_net]
    volumes:
      - dev_sandbox:/workspace              # всё поле боя здесь

  # ⬇️ Донастроим существующий app, чтобы он видел тот же volume
  app:
    volumes:
      - dev_sandbox:/sandbox                # /sandbox внутри app

services:
  prometheus:
    image: prom/prometheus:v2.52.0
    ports: ["9090:9090"]
    volumes:
      - ./extras/prometheus.yml:/etc/prometheus/prometheus.yml
  node_exporter:
    image: prom/node-exporter:v1.8.1
    ports: ["9100:9100"]
  grafana:
    image: grafana/grafana:11.0.0
    ports: ["3000:3000"]

networks:
  marka_net:
    driver: bridge

volumes:
  weaviate-data:
    name: weaviate-data
  dev_sandbox:
  ollama-data:

services:
  weaviate:
    image: semitechnologies/weaviate:1.30.0
    container_name: weaviate
    restart: always
    ports:
      - "8080:8080"
      - "50051:50051"
    networks:
      - marka_net
    volumes:
      - weaviate-data:/var/lib/weaviate
    environment:
      # базовые
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      QUERY_DEFAULTS_LIMIT: "25"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      # дополнительные настройки
      ENABLE_MODULES: "text2vec-openai"
      OPENAI_APIKEY: "${OPENAI_API_KEY}"
      TEXT2VEC_OPENAI_APIKEY: "${OPENAI_API_KEY}"
      AUTOSCHEMA: "false"
      # настройки кластера
      CLUSTER_HOSTNAME: node1 # любое уникальное имя
      RAFT_BOOTSTRAP_EXPECT: 1 # явно говорим «кластер = 1»
      HTTP_PROXY: "${HTTP_PROXY}"
      HTTPS_PROXY: "${HTTPS_PROXY}"
      NO_PROXY: "172.18.0.0/16,127.0.0.1,localhost"
      no_proxy: "172.18.0.0/16,127.0.0.1,localhost"
      TEXT2VEC_OPENAI_PROXYURL: "${HTTP_PROXY}"

  app:
    build: .
    container_name: app
    restart: always
    depends_on:
      - weaviate
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - RAG_MODE=v2
    networks:
      - marka_net
    volumes:
      - dev_sandbox:/sandbox
      - .:/app/langchain_api
      - ./scripts:/app/scripts

  bot:
    build:
      context: .
      dockerfile: telegram_bot/Dockerfile
    container_name: bot
    restart: always
    depends_on:
      - app
    env_file:
      - .env
    networks:
      - marka_net
    volumes:
      - .:/bot/langchain_api

  # --- sandbox для песочницы ---
  sandbox:
    image: python:3.10-slim
    container_name: sandbox
    command: ["sleep", "infinity"]
    working_dir: /workspace
    networks: [marka_net]
    volumes:
      - dev_sandbox:/workspace
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - NO_PROXY=${NO_PROXY}
    env_file:
      - .env


networks:
  marka_net:
    driver: bridge

volumes:
  dev_sandbox:
  graphiti-neo4j-data:
  redis_data:

services:
  app:
    build:
      context: ./langchain_api
      dockerfile: Dockerfile
    container_name: app
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - RAG_MODE=v2
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - NO_PROXY=${NO_PROXY}
    networks:
      - marka_net
    volumes:
      - dev_sandbox:/sandbox
      - ./langchain_api:/app
      - ./langchain_api/scripts:/app/scripts
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M

  bot:
    build:
      context: ./langchain_api
      dockerfile: telegram_bot/Dockerfile
    container_name: bot
    restart: always
    depends_on:
      - app
    working_dir: /app/langchain_api
    command: ["python", "-m", "telegram_bot.main"]
    env_file:
      - .env
    networks:
      - marka_net
    volumes:
      - ./langchain_api:/app/langchain_api
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 256M

  # --- sandbox для песочницы ---
  sandbox:
    image: python:3.10-slim
    container_name: sandbox
    command: ["sleep", "infinity"]
    working_dir: /workspace
    networks: [marka_net]
    volumes:
      - dev_sandbox:/workspace
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - NO_PROXY=${NO_PROXY}
    env_file:
      - .env
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 256M

  # --- GraphitiMemory validation service ---
  graphiti:
    build:
      context: ./langchain_api
      dockerfile: Dockerfile.graphiti
    container_name: graphiti
    restart: unless-stopped
    depends_on:
      graphiti-neo4j:
        condition: service_healthy
    ports:
      - "7878:7878"
    networks:
      - marka_net
    environment:
      - NEO4J_URI=bolt://graphiti-neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - GRAPHITI_API_HOST=0.0.0.0
      - GRAPHITI_API_PORT=7878
      - GRAPHITI_LOG_LEVEL=INFO
      - GRAPHITI_APOC_ENABLED=true
      - ENV=${ENV:-dev}
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - NO_PROXY=${NO_PROXY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # --- GraphitiMemory (official) side-by-side for evaluation ---
  # graphiti-new:
  #   image: getzep/graphiti:latest
  #   container_name: graphiti-new
  #   restart: unless-stopped
  #   depends_on:
  #     graphiti-neo4j:
  #       condition: service_healthy
  #   ports:
  #     - "7879:7878"  # внешне на 7879
  #   networks:
  #     - marka_net
  #   environment:
  #     - NEO4J_URI=bolt://graphiti-neo4j:7687
  #     - NEO4J_USERNAME=neo4j
  #     - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
  #     - GRAPHITI_LOG_LEVEL=INFO

  # --- Neo4j для GraphitiMemory ---
  graphiti-neo4j:
    image: neo4j:5.11
    container_name: graphiti-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    networks:
      - marka_net
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-password}
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_PLUGINS=["apoc"]
      # Оптимизация памяти
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1g
      - NEO4J_server_memory_pagecache_size=512m
      - NEO4J_server_config_strict__validation_enabled=false
    volumes:
      - graphiti-neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -lc '</dev/tcp/localhost/7687' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # --- Redis для сессий и кэша ---
  redis:
    image: redis:7-alpine
    container_name: marka-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6379:6379"  # Только локальный доступ с хоста
    networks:
      - marka_net
    volumes:
      - redis_data:/data
      - ./langchain_api/configs/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-defaultpass}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s


networks:
  marka_net:
    driver: bridge

volumes:
  weaviate-data:
    name: weaviate-data

services:
  weaviate:
    image: semitechnologies/weaviate:1.30.0
    container_name: weaviate
    restart: always
    ports:
      - "8080:8080"
      - "50051:50051"
    networks:
      - marka_net
    volumes:
      - weaviate-data:/var/lib/weaviate
    environment:
      # базовые
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      QUERY_DEFAULTS_LIMIT: "25"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      # кластер на одну ноду
      CLUSTER_HOSTNAME: "marka-node"
      RAFT_ENABLE_ONE_NODE_RECOVERY: "true"

  app:
    build: .
    container_name: app
    restart: always
    depends_on:
      - weaviate
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - marka_net

  bot:
    build:
      context: .
      dockerfile: telegram_bot/Dockerfile
    container_name: bot
    restart: always
    depends_on:
      - app
    env_file:
      - .env
    networks:
      - marka_net

networks:
  marka_net:
    driver: bridge

volumes:
  dev_sandbox:
  ollama-data:
  graphiti-neo4j-data:

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app
    restart: always
    # depends_on: weaviate - УДАЛЕНО
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - RAG_MODE=v2
    networks:
      - marka_net
    volumes:
      - dev_sandbox:/sandbox
      - .:/app/langchain_api
      - ./scripts:/app/scripts

  bot:
    build:
      context: .
      dockerfile: telegram_bot/Dockerfile
    container_name: bot
    restart: always
    depends_on:
      - app
    ports:
      - "8001:8001"
    env_file:
      - .env
    networks:
      - marka_net
    volumes:
      - .:/bot/langchain_api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # --- sandbox для песочницы ---
  sandbox:
    image: python:3.10-slim
    container_name: sandbox
    command: ["sleep", "infinity"]
    working_dir: /workspace
    networks: [marka_net]
    volumes:
      - dev_sandbox:/workspace
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - NO_PROXY=${NO_PROXY}
    env_file:
      - .env

  # --- GraphitiMemory validation service ---
  graphiti:
    build:
      context: .
      dockerfile: Dockerfile.graphiti
    container_name: graphiti
    restart: unless-stopped
    depends_on:
      - graphiti-neo4j
    ports:
      - "7878:7878"
    networks:
      - marka_net
    environment:
      - NEO4J_URI=bolt://graphiti-neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password
      - GRAPHITI_API_HOST=0.0.0.0
      - GRAPHITI_API_PORT=7878
      - GRAPHITI_LOG_LEVEL=INFO
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - NO_PROXY=${NO_PROXY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # --- Neo4j для GraphitiMemory ---
  graphiti-neo4j:
    image: neo4j:5.11
    container_name: graphiti-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    networks:
      - marka_net
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - graphiti-neo4j-data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password", "MATCH (n) RETURN count(n) LIMIT 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "marka-ai"
version = "2.6.0"
description = "A persistent personal Telegram agent powered by your Codex login"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["Pillow==12.3.0"]

[project.optional-dependencies]
semantic = ["onnxruntime==1.30.0", "tokenizers==0.23.2", "numpy==2.3.5"]

[project.scripts]
marka = "marka.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
marka = ["identity.md"]

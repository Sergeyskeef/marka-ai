[pytest]
# Настройки pytest
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Включаем asyncio режим
asyncio_mode = auto

# Настройки вывода
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -p no:warnings

# Маркеры для тестов
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    e2e: marks tests as end-to-end tests

# Настройки покрытия
[coverage:run]
source = .
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */env/*
    */.venv/*
    */migrations/*
    */config/*
    setup.py
    */setup.py
    conftest.py
    */conftest.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
sort = Cover

# Исключаем из анализа покрытия
exclude_lines =
    # Стандартные исключения
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstract
    @abstractmethod
    
    # Дебаг код
    if DEBUG:
    if debug:
    
    # Защитные проверки
    if 0:
    if False:

[coverage:html]
directory = htmlcov

[coverage:xml]
output = coverage.xml
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain_api"
version = "0.1.0"
description = "LangChain API with Graphiti and Neo4j"
requires-python = ">=3.10"

[tool.pytest.ini_options]
markers = [
    "core: marks tests as core functionality tests",
    "integration: marks tests as integration tests", 
    "unit: marks tests as unit tests",
    "slow: marks tests as slow running tests"
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=langchain_api --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["langchain_api"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/examples/*",
    "*/benchmarks/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod"
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "B904",  # временно игнорируем use-with-statement для CI
]

[tool.ruff.lint.per-file-ignores]
"benchmarks/*.py" = ["E722"]
"examples/*.py" = ["E402", "E722"]
"tests/*.py" = ["E722"]
"**/test_*.py" = ["E722"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["langchain_api"] 
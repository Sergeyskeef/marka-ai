# Guardrails конфигурация для Марк v2
# Политики безопасности и валидации для LLM

version: 1.0
rails:
  input:
    flows:
      - name: input_validation
        priority: 1
        steps:
          - name: check_length
            type: validator
            config:
              max_length: 4096
              min_length: 1
          - name: check_pii
            type: validator
            config:
              pii_detection: true
              allowed_pii: ["email"]  # Разрешаем email для регистрации
          - name: check_profanity
            type: validator
            config:
              profanity_detection: true
              block_profanity: true

  output:
    flows:
      - name: output_validation
        priority: 1
        steps:
          - name: validate_json_schema
            type: validator
            config:
              schema:
                type: object
                required: ["role", "content"]
                properties:
                  role:
                    type: string
                    enum: ["assistant", "user", "system"]
                  content:
                    type: string
                    maxLength: 8192
                  tool_calls:
                    type: array
                    items:
                      type: object
                      required: ["id", "type", "function"]
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                          enum: ["function"]
                        function:
                          type: object
                          required: ["name", "arguments"]
                          properties:
                            name:
                              type: string
                            arguments:
                              type: string
          - name: check_content_safety
            type: validator
            config:
              content_filter: true
              block_harmful_content: true
              max_response_time: 30

  conversation:
    flows:
      - name: conversation_flow
        priority: 1
        steps:
          - name: context_window
            type: validator
            config:
              max_context_length: 16000
              max_history_length: 20
          - name: rate_limiting
            type: validator
            config:
              max_requests_per_minute: 60
              max_requests_per_hour: 1000

# Настройки для инструментов
tools:
  validation:
    enabled: true
    max_tool_calls_per_request: 10
    allowed_tools:
      - "run_code"
      - "search_memory"
      - "web_search"
      - "graph_search"
      - "summarize_text"
      - "read_file"
      - "write_file"

# Настройки логирования
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  handlers:
    - type: file
      filename: "logs/guardrails.log"
      max_bytes: 10485760  # 10MB
      backup_count: 5
    - type: console
      level: WARNING 
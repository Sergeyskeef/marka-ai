networks:
  marka_net:
    driver: bridge

volumes:
  dev_sandbox:
  ollama-data:
  graphiti-neo4j-data:
  redis_data:

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app
    restart: always
    # depends_on: weaviate - УДАЛЕНО
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - RAG_MODE=v2
    networks:
      - marka_net
    volumes:
      - dev_sandbox:/sandbox
      - .:/app
      - ./scripts:/app/scripts
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M

  bot:
    build:
      context: .
      dockerfile: telegram_bot/Dockerfile
    container_name: bot
    restart: always
    depends_on:
      - app
    working_dir: /bot/langchain_api/telegram_bot
    command: ["python", "main.py"]
    # Бот не поднимает HTTP-сервер, порт не публикуем
    # ports:
    #   - "8001:8001"
    env_file:
      - .env
    networks:
      - marka_net
    volumes:
      - .:/bot/langchain_api
    # Healthcheck отключен, т.к. бот работает по long-polling и не экспонирует /health
    # healthcheck:
    #   test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8001/health')"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 256M

  # --- sandbox для песочницы ---
  sandbox:
    image: python:3.10-slim
    container_name: sandbox
    command: ["sleep", "infinity"]
    working_dir: /workspace
    networks: [marka_net]
    volumes:
      - dev_sandbox:/workspace
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - NO_PROXY=${NO_PROXY}
    env_file:
      - .env
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 256M

  # --- GraphitiMemory validation service ---
  graphiti:
    build:
      context: .
      dockerfile: Dockerfile.graphiti
    container_name: graphiti
    restart: unless-stopped
    depends_on:
      graphiti-neo4j:
        condition: service_healthy
    ports:
      - "7878:7878"
    networks:
      - marka_net
    environment:
      - NEO4J_URI=bolt://graphiti-neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - GRAPHITI_API_HOST=0.0.0.0
      - GRAPHITI_API_PORT=7878
      - GRAPHITI_LOG_LEVEL=INFO
      - GRAPHITI_APOC_ENABLED=true
      - ENV=${ENV:-dev}
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - NO_PROXY=${NO_PROXY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # --- Neo4j для GraphitiMemory ---
  graphiti-neo4j:
    image: neo4j:5.11
    container_name: graphiti-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    networks:
      - marka_net
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-password}
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_PLUGINS=["apoc"]
      # Оптимизация памяти
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1g
      - NEO4J_server_memory_pagecache_size=512m
      - NEO4J_server_config_strict__validation_enabled=false
      # Оптимизация производительности (удалены несовместимые параметры для Neo4j 5.x)
      # - NEO4J_db_transaction_logs_rotation_retention__policy=2 days
      # - NEO4J_db_query__cache__size=1000
      # - NEO4J_dbms_memory_transaction_total_max=2g
      # Включаем векторный поиск (отключено для совместимости с neo4j:5.11)
      # - NEO4J_db_index_vector_enabled=true
    volumes:
      - graphiti-neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -lc '</dev/tcp/localhost/7687' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # --- Redis для сессий и кэша ---
  redis:
    image: redis:7-alpine
    container_name: marka-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - marka_net
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

